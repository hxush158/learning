[project]
name = "ch10-mcp"
version = "0.1.0"
description = "第10章 MCP技术应用与开发 —— 可运行工程版"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # MCP SDK：必须 < 2。mcp 2.x 把 FastMCP 改名为 MCPServer、streamablehttp_client 也改了名，课程代码会直接报错
    "mcp>=1.9.4,<1.10",
    # mcp 1.9.x 引用了 pydantic 内部函数 eval_type_backport，pydantic 2.14 起已删除
    "pydantic>=2.11,<2.14",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    # MySQL MCP Server
    "mysql-connector-python>=9.3.0",
    # SSE / Streamable HTTP 服务端
    "uvicorn>=0.34",
    "starlette>=0.46",
    # 第 6 节：LangGraph ReAct Agent + MCP
    "langgraph>=0.4.5,<0.5",
    "langchain>=0.3.25,<0.4",
    "langchain-openai>=0.3.17,<0.4",
    "langchain-mcp-adapters>=0.1.0,<0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_chat"]
